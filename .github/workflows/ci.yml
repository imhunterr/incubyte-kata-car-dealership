# Runs lint, type checks and the full test suites on every push and PR.
# Coverage and JUnit reports are uploaded as build artifacts (the test report).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: dealership
          POSTGRES_DB: dealership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership -d dealership_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dealership:dealership@localhost:5432/dealership_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: >-
          uv run pytest --cov --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-report
          path: |
            backend/test-results.xml
            backend/coverage.xml

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and format check
        run: npm run lint && npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Build
        run: npm run build
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-report
          path: |
            frontend/test-results.xml
            frontend/coverage/
