# Serves the built SPA and forwards API calls to the FastAPI container, so the
# browser only ever talks to one origin (no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints asset file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/login, /register, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
